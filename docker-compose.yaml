version: "3.9"

services:
  dev:
    container_name: erc-aeronautics
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: osrf/ros:humble-desktop
        WORKSPACE: ${PWD}
        USERNAME: ${USERNAME:-drone_dev}
        # USER_UID: 1000
        # USER_GID: 1000

    network_mode: host
    tty: true
    working_dir: /home/${USERNAME:-drone_dev}/ros_ws/

    ports:
      - "11345:11345"

    environment:
      # --- ROS Configuration ---
      ROS_DOMAIN_ID: 1
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

      # --- Gazebo Resource Paths ---
      GZ_SIM_RESOURCE_PATH: ${GZ_SIM_RESOURCE_PATH:-/home/${USERNAME:-drone_dev}/sim/gazebo/models:/home/${USERNAME:-drone_dev}/sim/gazebo/worlds}
      IGN_GAZEBO_RESOURCE_PATH: ${IGN_GAZEBO_RESOURCE_PATH:-/home/${USERNAME:-drone_dev}/sim/gazebo/models:/home/${USERNAME:-drone_dev}/sim/gazebo/worlds}

      # --- Display (X11 / Wayland) ---
      DISPLAY: ${DISPLAY}
      XAUTHORITY: ${XAUTHORITY}
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      PULSE_SERVER: ${PULSE_SERVER}

      # --- Optional GPU ---
      # LIBGL_ALWAYS_SOFTWARE: 1

    # Uncomment if NVIDIA Container Toolkit is installed
    # runtime: nvidia
    # gpus: all

    volumes:
      # --- Runtime & Build Paths ---
      - /run/user/1000:/run/user/1000
      - ./src:/home/${USERNAME:-drone_dev}/ros_ws/src
      - ./.colcon/build:/home/${USERNAME:-drone_dev}/ros_ws/build
      - ./.colcon/install:/home/${USERNAME:-drone_dev}/ros_ws/install
      - ./.colcon/log:/home/${USERNAME:-drone_dev}/ros_ws/log
      - ./px4:/home/${USERNAME:-drone_dev}/ros_ws/px4
      - ./.git:/home/${USERNAME:-drone_dev}/ros_ws/.git

      # --- Display (X11) ---
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # --- Optional: Devices / USB ---
      # - /dev:/dev
      # - /dev/bus/usb:/dev/bus/usb
