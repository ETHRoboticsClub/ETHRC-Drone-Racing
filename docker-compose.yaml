services:
  dev:
    container_name: erc-aeronautics
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: osrf/ros:humble-desktop
        WORKSPACE: ${PWD}
        USERNAME: ${USERNAME:-drone_dev}
        # USER_UID: 1000
        # USER_GID: 1000

    network_mode: host
    tty: true
    working_dir: /home/${USERNAME:-drone_dev}/ros_ws/

    ports:
      - "11345:11345"

    environment:
      # --- ROS Configuration ---
      ROS_DOMAIN_ID: 1
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

      # --- Gazebo Resource Paths ---
      GZ_SIM_RESOURCE_PATH: ${GZ_SIM_RESOURCE_PATH:-/home/${USERNAME:-drone_dev}/sim/gazebo/models:/home/${USERNAME:-drone_dev}/sim/gazebo/worlds}
      IGN_GAZEBO_RESOURCE_PATH: ${IGN_GAZEBO_RESOURCE_PATH:-/home/${USERNAME:-drone_dev}/sim/gazebo/models:/home/${USERNAME:-drone_dev}/sim/gazebo/worlds}

      # --- Display (X11 / Wayland) ---
      DISPLAY: ${DISPLAY}
      XAUTHORITY: ${XAUTHORITY}
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      PULSE_SERVER: ${PULSE_SERVER}

      # --- Optional GPU ---
      # LIBGL_ALWAYS_SOFTWARE: 1

    # Uncomment if NVIDIA Container Toolkit is installed
    # runtime: nvidia
    # gpus: all

  ov_ros1:
    build:
      context: .
      dockerfile: docker/Dockerfile.ros1
    container_name: erc-ov-ros1
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://127.0.0.1:11311
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # Mount the whole repo to access EuRoC config and bags
      - ./:/ws:rw
      # A persistent catkin_ws outside the image is optional; you can also build in-container
      - ./.colcon/ros1_catkin_ws:/catkin_ws
    working_dir: /catkin_ws
    tty: true
