%YAML:1.0
---
# ArUco Marker Map Configuration
# Extracted from: px4/PX4-Autopilot/Tools/simulation/gz/worlds/aruco.sdf
# Dictionary: DICT_5X5_100
# Coordinate Frame: World (Gazebo ENU)
# All positions in meters, orientations in radians (roll, pitch, yaw)

marker_dict: "DICT_5X5_100"
reference_frame: "world"
marker_size: 0.2 

markers:
  # Marker 0: On Wall 1 surface facing +Y direction
  # Located at X=0.5m, Y=0.01m, Z=0.5m
  # Rotation: -90° around X axis (facing away from wall)
  - id: 0
    size: 0.2
    pose:
      position: [0.5, 0.01, 0.5]
      orientation: [-1.5708, 0.0, 0.0]
    description: "Marker id: 0 on Wall 1 (YZ plane)"

  # Marker 1: On Wall 2 surface facing +X direction
  # Located at X=0.01m, Y=0.5m, Z=0.5m
  # Rotation: 90° around X, 90° around Z (facing away from wall)
  - id: 1
    size: 0.2
    pose:
      position: [0.01, 0.5, 0.5]
      orientation: [1.5708, 0.0, 1.5708]
    description: "Marker id: 1 on Wall 2 (XZ plane)"

  # Marker 2: On Floor facing +Z direction (upward)
  # Located at X=0.5m, Y=0.5m, Z=0.01m
  # Rotation: No rotation (lying flat)
  - id: 2
    size: 0.2
    pose:
      position: [0.5, 0.5, 0.01]
      orientation: [0.0, 0.0, 0.0]
    description: "Marker id: 2 on Floor (XY plane)"
