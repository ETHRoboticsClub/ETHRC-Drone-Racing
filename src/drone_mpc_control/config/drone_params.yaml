# Parametri fisici del drone
mass: 0.5               # kg
gravity: 9.8            # m/s^2

# Momenti d'inerzia
inertia:
  I_xx: 0.00232         # kg*m^2
  I_yy: 0.00232
  I_zz: 0.00400

# Vincoli sui controlli
constraints:
  thrust_min: -10.0     # N
  thrust_max: 10.0      # N
  moment_min: -1.0      # Nm
  moment_max: 1.0       # Nm
  angular_vel_min: -3.14159  # rad/s
  angular_vel_max: 3.14159   # rad/s