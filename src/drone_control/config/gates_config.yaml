      - name: G5
        x: 40.0
        y:  0.0
        z: -5.5
        yaw_deg:   0.0
        width:  2.0
        height: 2.0

      - name: G6
        x: 48.0
        y:  0.0
        z: -6.5
        yaw_deg:   0.0
        width:  2.0
        height: 2.0

      - name: G7
        x: 56.0
        y:  0.0
        z: -7.5
        yaw_deg:   0.0
        width:  2.0
        height: 2.0

      - name: G8
        x: 64.0
        y:  0.0
        z: -8.5
        yaw_deg:   0.0
        width:  2.0
        height: 2.0

  # ──────────────────────────────────────────────────────────────────
  # CIRCULAR — 8 gates equally spaced on a circle
  #            centre (24, 0), radius 16 m
  #            G1 starts 8 m ahead of spawn for a smooth lead-in.
  # ──────────────────────────────────────────────────────────────────
  circular:
    track:
      SHOW_TUNNEL:   true
      W_nominal:    4.0
      H_nominal:    3.5
      sigma_gate:   3.0
      qc_nom:       3.0
      qc_gate:      15.0
      sigma_qc:     0.5
      track_weight: 10.0
    gates:
      # G1 — left side of the circle, after lead-in from spawn
      - name: G1
        x:  8.0
        y:  0.0
        z: -3.0
        yaw_deg:  68.0
        width:  2.0
        height: 2.0

      - name: G2
        x: 12.7
        y: 11.3
        z: -3.2
        yaw_deg:  22.0
        width:  2.0
        height: 2.0

      - name: G3
        x: 24.0
        y: 16.0
        z: -3.5
        yaw_deg: -22.0
        width:  2.0
        height: 2.0

      - name: G4
        x: 35.3
        y: 11.3
        z: -3.8
        yaw_deg: -68.0
        width:  2.0
        height: 2.0

      - name: G5
        x: 40.0
        y:  0.0
        z: -4.0
        yaw_deg: -112.0
        width:  2.0
        height: 2.0

      - name: G6
        x: 35.3
        y: -11.3
        z: -3.8
        yaw_deg: -158.0
        width:  2.0
        height: 2.0

      - name: G7
        x: 24.0
        y: -16.0
        z: -3.5
        yaw_deg: 158.0
        width:  2.0
        height: 2.0

      - name: G8
        x: 12.7
        y: -11.3
        z: -3.2
        yaw_deg: 112.0
        width:  2.0
        height: 2.0

  # ──────────────────────────────────────────────────────────────────
  # SplitS — circuit with exactly one Split-S maneuver
  #
  #   G4 (entry)  x=40, y=0, z=-3.0, yaw=  0°  ← heading North
  #   G5 (exit)   x=40, y=0, z=-6.5, yaw=180°  ← heading South, 3.5 m lower
  #
  #   G4 and G5 share the same (x, y) — one gate literally above the other.
  #   The drone rolls inverted at G4, pulls a downward half-loop, and exits
  #   G5 in the opposite direction 3.5 m below the entry altitude.
  #   H_nominal is enlarged to accommodate the altitude gap within the tunnel.
  # ──────────────────────────────────────────────────────────────────
  SplitS:
    track:
      SHOW_TUNNEL:   true
      W_nominal:    4.0
      H_nominal:    6.0
      sigma_gate:   3.5
      qc_nom:       3.0
      qc_gate:      15.0
      sigma_qc:     0.5
      track_weight: 10.0
    gates:
      # G1 — start / finish, 8 m ahead of spawn
      - name: G1
        x:  8.0
        y:  0.0
        z: -3.0
        yaw_deg:   0.0
        width:  2.0
        height: 2.0

      # G2 — outbound straight
      - name: G2
        x: 18.0
        y:  0.0
        z: -3.0
        yaw_deg:   0.0
        width:  2.0
        height: 2.0

      # G3 — slight right kink before Split-S
      - name: G3
        x: 30.0
        y: -4.0
        z: -3.0
        yaw_deg: -12.0
        width:  2.0
        height: 2.0

      # G4 — SPLIT-S ENTRY: heading North
      - name: G4
        x: 40.0
        y:  0.0
        z: -3.0
        yaw_deg:   0.0
        width:  2.0
        height: 2.0

      # G5 — SPLIT-S EXIT: same (x,y), 3.5 m lower, now heading South
      - name: G5
        x: 40.0
        y:  0.0
        z: -6.5
        yaw_deg: 180.0
        width:  2.0
        height: 2.0

      # G6 — recovery, climbing South-West
      - name: G6
        x: 30.0
        y:  6.0
        z: -5.0
        yaw_deg: 150.0
        width:  2.0
        height: 2.0

      # G7 — return leg heading West
      - name: G7
        x: 18.0
        y:  7.0
        z: -4.0
        yaw_deg: 170.0
        width:  2.0
        height: 2.0

      # G8 — final turn back toward start
      - name: G8
        x:  4.0
        y:  6.0
        z: -3.0
        yaw_deg: -60.0
        width:  2.0
        height: 2.0
