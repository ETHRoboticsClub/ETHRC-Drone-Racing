# gates_config.yaml
# Competition-style gate track for MPCC controller — NED frame (z negative = altitude)
#
# Track layout (top view, NED: x=North, y=East):
#
#       G8(-1, 4)      G1(4,0)      G2(14,3)
#           \           |           /
#        G7(-4,-5)    start    G3(24,0)   ← main straight
#               \                /
#             G6(4,-10)    G4(22,-8)
#                    \    /
#                  G5(14,-12)          ← hairpin
#
# Gate fields:
#   name      — label shown in RViz
#   x, y, z   — gate centre in NED [m]  (z negative = altitude above ground)
#   yaw_deg   — direction of flight through the gate in NED convention
#               (0 = North, 90 = East, 180 = South, -90 = West)
#               Computed as the bisector of the incoming and outgoing track vectors.
#   width     — inner aperture width  [m]  (horizontal, perpendicular to yaw)
#   height    — inner aperture height [m]  (vertical)
#
# track section — global tunnel parameters:
#   W_nominal    tunnel half-width  between gates [m]  (drone can fly freely)
#   H_nominal    tunnel half-height between gates [m]
#   sigma_gate   Gaussian σ for W/H transitions [m]  (controls narrowing speed)
#   qc_nom       nominal contouring weight (on straights, progress dominates)
#   qc_gate      gate   contouring weight  (near gates, tracking is critical)
#   sigma_qc     Gaussian σ for qc transition [m]
#   track_weight penalty weight for track-constraint soft barrier in OCP cost

track:
  W_nominal:    3.0
  H_nominal:    3.0
  sigma_gate:   2.0
  qc_nom:       0.5
  qc_gate:      10.0
  sigma_qc:     0.5
  track_weight: 10.0

gates:
  # G1 — start / finish
  - name: G1
    x:  4.0
    y:  0.0
    z: -3.0
    yaw_deg: -11.0
    width:  2.0
    height: 2.0

  # G2 — entry to main straight, climbing
  - name: G2
    x:  14.0
    y:   3.0
    z: -4.0
    yaw_deg: 0.0
    width:  2.0
    height: 2.0

  # G3 — far end of main straight, max altitude
  - name: G3
    x:  24.0
    y:   0.0
    z: -5.0
    yaw_deg: -60.0
    width:  2.0
    height: 2.0

  # G4 — sweeping right, dive begins
  - name: G4
    x:  22.0
    y:  -8.0
    z: -4.0
    yaw_deg: -129.0
    width:  2.0
    height: 2.0

  # G5 — hairpin apex, lowest point on return
  - name: G5
    x:  14.0
    y: -12.0
    z: -3.0
    yaw_deg: -172.0
    width:  2.0
    height: 2.0

  # G6 — back chicane, flat and fast
  - name: G6
    x:   4.0
    y: -10.0
    z: -2.5
    yaw_deg: 159.0
    width:  2.0
    height: 2.0

  # G7 — technical left turn, climbing
  - name: G7
    x:  -4.0
    y:  -5.0
    z: -3.5
    yaw_deg: 110.0
    width:  2.0
    height: 2.0

  # G8 — return gate, high before diving back to start
  - name: G8
    x:  -1.0
    y:   4.0
    z: -4.0
    yaw_deg: 16.0
    width:  2.0
    height: 2.0
