bridges:
  # All SITL perception nodes use Gazebo's clock epoch.  This bridge is
  # deliberately separate from the sensor bridges so it cannot alter the
  # Betaflight control path.
  - name: simulation_clock
    gz_topic: "/clock"
    ros2_type: "rosgraph_msgs/msg/Clock"
    gz_type: "gz.msgs.Clock"
    direction: "GZ_TO_ROS"
    remap_to: "/clock"
    enabled: true

  - name: camera_image
    gz_topic: "/drone/camera/image"
    ros2_type: "sensor_msgs/msg/Image"
    gz_type: "gz.msgs.Image"
    direction: "GZ_TO_ROS"
    remap_to: "/cam0/image_raw"
    enabled: true

  - name: camera_info
    gz_topic: "/drone/camera/camera_info"
    ros2_type: "sensor_msgs/msg/CameraInfo"
    gz_type: "gz.msgs.CameraInfo"
    direction: "GZ_TO_ROS"
    remap_to: "/cam0/camera_info"
    enabled: true

  - name: camera_imu
    gz_topic: "/drone/imu"
    ros2_type: "sensor_msgs/msg/Imu"
    gz_type: "gz.msgs.IMU"
    direction: "GZ_TO_ROS"
    remap_to: "/imu0"
    enabled: true

  - name: groundtruth
    gz_topic: "/drone/odometry"
    ros2_type: "nav_msgs/msg/Odometry"
    gz_type: "gz.msgs.Odometry"
    direction: "GZ_TO_ROS"
    remap_to: "/odometry"
    enabled: true
