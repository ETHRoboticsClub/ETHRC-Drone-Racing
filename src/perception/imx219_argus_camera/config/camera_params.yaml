argus_camera_node:
  ros__parameters:
    sensor_id: 0
    width: 1280
    height: 720
    framerate: 60.0
    output_encoding: "mono8"
    frame_id: "cam0"
    # The camera is mounted upside-down on Zephyrus. GStreamer nvvidconv
    # flip-method=2 rotates frames by 180 degrees before ROS publication.
    # Set to 0 for no rotation if the camera is mounted upright.
    flip_method: 2

    exposure_time_range_ns: []
    gain_range: []
    denoise_mode: "fast"            # off | fast | high_quality
    edge_enhance_mode: "fast"       # off | fast | high_quality

    # CameraInfo — calibrated 2026-04-25 (see camera_calibration/imx219_720p_60fps.json
    # for full provenance, RMS, and the radtan equivalent).
    # Model: equidistant (Kannala-Brandt 4-coeff) — correct for ~131 deg
    # HFOV wide-angle. Reprojection RMS = 0.66 px.
    # K matrix (row-major 3x3): [fx, 0, cx, 0, fy, cy, 0, 0, 1]
    camera_matrix: [559.381783658702, 0.0,                637.688519620621,
                    0.0,              559.454491361351,   352.82329454271405,
                    0.0,              0.0,                1.0]
    distortion_coefficients: [0.06702863120032837,
                              -0.028541813941209592,
                              -0.018213245805178305,
                              0.05872486156737494]
    distortion_model: "equidistant"
