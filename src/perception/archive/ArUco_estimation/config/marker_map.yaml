%YAML:1.0
---
# ArUco Marker Map Configuration
# Extracted from: px4/PX4-Autopilot/Tools/simulation/gz/worlds/aruco.sdf
# Dictionary: DICT_5X5_1000
# Coordinate Frame: World (Gazebo ENU)
# All positions in meters, orientations in radians (roll, pitch, yaw)

marker_dict: "DICT_5X5_1000"
reference_frame: "world"
marker_size: 0.5 

markers:
  # Marker 0: On Wall 1 inner surface facing -Y (toward spawn)
  # SDF pose: 1.5 0.83 0.5 1.5708 0 0
  - id: 4
    size: 0.5 
    pose:
      position: [0.5, 0.01, 0.5]
      orientation: [-1.5708, 0.0, 0.0]
    description: "Marker id: 0 on Wall 1 (YZ plane)"

  # Marker 1: On Wall 2 inner surface facing -X (toward spawn)
  # SDF pose: 1.83 0 0.5 1.5708 0 -1.5708
  - id: 5
    size: 0.5
    pose:
      position: [0.01, 0.5, 0.5]
      orientation: [1.5708, 0.0, 1.5708]
    description: "Marker id: 1 on Wall 2 (XZ plane)"

  # Marker 2: On Floor facing +Z (upward)
  # SDF pose: 0.3 0.3 0.01 0 0 0
  - id: 6
    size: 0.5
    pose:
      position: [0.5, 0.5, 0.01]
      orientation: [0.0, 0.0, 0.0]
    description: "Marker id: 2 on Floor (XY plane)"
