ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    publish_tf: true
    two_d_mode: false

    base_link_frame: base_link
    odom_frame: odom
    world_frame: odom

    # VIO as Odometry — orientation DISABLED to force the EKF to reconstruct
    # heading from angular-rate integration and the drone physics model.
    # This reflects realistic VIO behaviour: velocity and angular rate are
    # accurate, but absolute orientation drifts and is not trusted.
    # [x, y, z, qw, qx, qy, qz, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /vio/odometry
    odom0_config: [true, true, true,   false, false, false, false,   true, true, true,
                   true, true, true,  false, false, false]
    odom0_differential: false

    # Vision — sparse absolute pose (simulates gate-marker detections).
    # Vision is the ONLY source of absolute orientation; run at 5 Hz via
    # vision_rate_hz:=5.0 in the launch command.
    # [x, y, z, qw, qx, qy, qz, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    pose0: /vision/pose
    pose0_config: [true, true, true,   true, true, true, true,
                   false, false, false, false, false, false, false, false, false]
    pose0_differential: false

    predict_to_current_time: true
    transform_timeout: 0.02
    transform_time_offset: 0.0

    print_diagnostics: true
    debug: false
    debug_out_file: "/tmp/ekf_hard_debug.txt"

    smooth_lagged_data: true
    history_length: 0.5

    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_relative: false

    pose0_queue_size: 10
    pose0_nodelay: false
    pose0_relative: false

    publish_acceleration: true

    use_control: true
    stamped_control: true
    control_timeout: 0.2
    control0: cmd_vel

    # [vx, vy, vz, vroll, vpitch, vyaw]
    control_config: [true, true, true,
                     false, false, false]
