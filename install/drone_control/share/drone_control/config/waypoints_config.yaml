# waypoints_config.yaml
# ETH Sprint Circuit — race-style track (NED frame, z negative = altitude)
#
# Layout (top view):
#
#       G8(-5, 4)      G1(0,0)      G2(10,3)
#           \           |           /
#        G7(-8,-5)    start    G3(20,0)   ← main straight, climb to 5m
#               \                /
#             G6(0,-10)    G4(18,-8)
#                    \    /
#                  G5(10,-12)          ← hairpin, lowest point
#
# Altitude profile (NED z):
#   G1: -3.0 m  → G2: -4.0 m  → G3: -5.0 m  (climb on main straight)
#   G3: -5.0 m  → G4: -4.0 m  → G5: -3.0 m  (dive into hairpin)
#   G5: -3.0 m  → G6: -2.5 m  → G7: -3.5 m  → G8: -4.0 m  (technical back section)
#   G8 → G1: return, dropping back to 3m
#
# time_from_beginning is required by the client but ignored by the controller
# (node advances on waypoint_reached, not on time). The controller loops forever.

waypoints:
  # G1 — start / finish line
  - x:  0.0
    y:  0.0
    z: -3.0
    yaw_deg: 0.0
    time_from_beginning: 2.0

  # G2 — entry to main straight, climbing
  - x:  10.0
    y:   3.0
    z: -4.0
    yaw_deg: 0.0
    time_from_beginning: 4.0

  # G3 — far end of main straight, max altitude
  - x:  20.0
    y:   0.0
    z: -5.0
    yaw_deg: 0.0
    time_from_beginning: 6.0

  # G4 — sweeping right, beginning the dive
  - x:  18.0
    y:  -8.0
    z: -4.0
    yaw_deg: 0.0
    time_from_beginning: 8.0

  # G5 — hairpin apex, lowest point on return
  - x:  10.0
    y: -12.0
    z: -3.0
    yaw_deg: 0.0
    time_from_beginning: 10.0

  # G6 — back chicane, flat and fast
  - x:   0.0
    y: -10.0
    z: -2.5
    yaw_deg: 0.0
    time_from_beginning: 12.0

  # G7 — technical left turn, climbing
  - x:  -8.0
    y:  -5.0
    z: -3.5
    yaw_deg: 0.0
    time_from_beginning: 14.0

  # G8 — return gate, high before diving back to start
  - x:  -5.0
    y:   4.0
    z: -4.0
    yaw_deg: 0.0
    time_from_beginning: 16.0
