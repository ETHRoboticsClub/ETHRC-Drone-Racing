site_name: ETHRC Drone Racing
site_url: http://0.0.0.0:8000
repo_url: https://github.com/ETHRoboticsClub/ETHRC-Drone-Racing
repo_name: ETHRoboticsClub/ETHRC-Drone-Racing
edit_uri: edit/main/docs/docs/

theme:
  name: material
  logo: images/ETHRC_Aero_favicon_black.png
  favicon: images/ETHRC_Aero_favicon_black.png
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css




markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

plugins:
  - search

