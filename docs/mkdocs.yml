site_name: ETHRC Drone Racing
site_url: http://0.0.0.0:8000
repo_url: https://github.com/ETHRoboticsClub/ETHRC-Drone-Racing
repo_name: ETHRoboticsClub/ETHRC-Drone-Racing
edit_uri: edit/main/docs/docs/

theme:
  name: material
  logo: images/ETHRC_Aero_favicon_black.png
  favicon: images/ETHRC_Aero_favicon_black.png
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css




markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Recent Updates: updates.md
  - Future Improvements: future-improvements.md
  - Getting Started: getting-started.md
  - Guidelines: guidelines.md
  - Infrastructure:
    - Overview: infrastructure/index.md
    - AWS Setup: infrastructure/aws_setup.md
    - AWS EC2 Instances: infrastructure/aws_ec2.md
    - AWS ECR: infrastructure/aws_ecr.md
  - Perception:
    - Overview: perception/index.md
    - VIO: perception/vio.md
    - Vicon: perception/vicon.md
    - Gate Detection: perception/gate_detection.md
    - EKF: perception/EKF.md
    - Camera Calibration:
      - Overview: calibration/index.md
      - IMX219 Intrinsics: calibration/imx219_intrinsics.md
  - Controls:
    - Overview: controls/index.md
    - Drone Control: controls/drone_control.md
    - Betaflight MSP Control: controls/msp_control.md
    - MAVSDK: controls/mavsdk.md
    - MPC: controls/mpc.md
    - RL: controls/rl.md
    - Troubleshooting: controls/troubleshooting.md
  - Drone Setup:
    - Overview: drone-setup/index.md
    - Zephyrus (6S): drone-setup/zephyrus.md
    - Boreas (4S): drone-setup/boreas.md
    - VIO Synchronization: drone-setup/vio_synchronization.md
    - Betaflight Setup: betaflight.md
  - Groundstation: groundstation/index.md
  - Contributors: contributors.md
  - Deprecated:
    - ArUco: perception/ArUco.md


