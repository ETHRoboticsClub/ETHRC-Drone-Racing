site_name: ETHRC Drone Racing
site_url: http://0.0.0.0:8000
repo_url: https://github.com/ETHRoboticsClub/ETHRC-Drone-Racing
repo_name: ETHRoboticsClub/ETHRC-Drone-Racing
edit_uri: edit/main/docs/docs/

theme:
  name: material
  logo: images/ETHRC-Aeronautics_transparent.png
  favicon: images/ETHRC_Aero_favicon_black.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guidelines: guidelines.md


