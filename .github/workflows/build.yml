name: Build Verification

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'merge/*'
      - 'fix/*'
  pull_request:
    branches:
      - main
      - 'feature/*'
      - 'merge/*'
      - 'fix/*'

jobs:
  build:
    name: Build Docker Image
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Submodules (Excluding Private)
        run: |
          # Manually initialize only the submodules we need and have access to
          git submodule update --init --recursive px4/PX4-Autopilot
          git submodule update --init --recursive src/perception/VIO/open_vins+

      - name: Build Docker Image
        run: |
          # Use docker-compose to build the image.
          # We don't use -d here as we only want to verify the build.
          docker compose build --no-cache

      - name: Cleanup
        if: always()
        run: |
          # Remove the specific image built in this run to save space
          docker rmi ethrc-drone-racing-dev:latest || true
          
          # Prune dangling data and the BuildKit build cache specifically
          docker system prune -f
          docker builder prune -a -f
