name: Build Verification

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'merge/*'
      - 'fix/*'
  pull_request:
    branches:
      - main
      - 'feature/*'
      - 'merge/*'
      - 'fix/*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: [docs, perception, mpc, rl, dev]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Submodules (Excluding Private)
        run: |
          # On self-hosted runners, submodules can get into a dirty state.
          # We force update and ensure nested revisions are clean.
          git submodule foreach --recursive git reset --hard
          git submodule update --init --recursive --force px4/PX4-Autopilot
          git submodule update --init --recursive --force src/perception/VIO/open_vins
          git submodule update --init --recursive --force src/ros2-vicon-receiver

      - name: Build Docker Service
        run: |
          # Use a unique project name and container name per run to avoid collisions
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ matrix.service }}"
          export CONTAINER_NAME="ci_${{ github.run_id }}_${{ matrix.service }}"
          # Use docker-compose to build the specific service.
          docker compose build --no-cache ${{ matrix.service }}

      - name: Cleanup
        if: always()
        run: |
          # Remove the specific image built in this run to save space
          # Docker compose uses specific tagging usually, but we prune for safety
          docker system prune -f
          docker builder prune -a -f
